name: Refresh public sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python refresh_public.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -m unittest discover -s tests
      - run: mkdir -p site && python generate.py inventory.json site/index.html --audience public
      - run: python export_catalog.py inventory.json site/catalog.json --audience public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
